name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  marketplace-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: Run repository quality checks and test suites
        run: python3 scripts/verify_all.py
